<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hassas Dengeler | Dijital Dergi</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Georgia', serif; }
        .magazine-container {
            height: 100vh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
        }
        section {
            height: 100vh;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            background-size: cover;
            background-position: center;
        }
        .content-box {
            background: rgba(0, 0, 0, 0.6);
            padding: 40px;
            max-width: 600px;
            border-left: 4px solid #gold;
        }
        h1 { font-size: 3rem; margin-bottom: 10px; }
        p { font-size: 1.2rem; line-height: 1.6; }
        /* Kapak görseli buraya gelecek */
        #cover { background-image: url('cover.jpg'); }
        #kinesin { background-image: url('kinesin.jpg'); }
    </style>
</head>
<body>
    <div class="magazine-container">
        <section id="cover">
            <div class="content-box">
                <h1>HASSAS DENGELER</h1>
                <p>Kusursuz Düzenin Bilimi</p>
                <span>Sayı 01 / 2026</span>
            </div>
        </section>
        <section id="kinesin">
            <div class="content-box">
                <h2>Moleküler Motorlar</h2>
                <p>Hücre içindeki nanometrik lojistik sistemleri ve kinesin proteinlerinin hayranlık uyandıran yürüyüşü.</p>
            </div>
        </section>
    </div>
</body>
</html>
